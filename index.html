<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITNOX – Gym Manager</title>
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#14181d;--card2:#1a2027;--line:#262e37;--tx:#e9edf0;--mu:#8f9aa6;--ac:#c6ff3d;--ac-ink:#10140a;--or:#ff6b2c;--rd:#ff5468;--am:#ffb020;--gn:#3ddc84;--bl:#5ab0ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 16px}
.logo{font:800 30px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em}
.logo b{color:var(--ac)}
.logo small{display:block;font:500 10px Inter;letter-spacing:.3em;color:var(--mu);margin-top:3px}
#sync{font-size:12px;color:var(--mu)}
nav{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line);margin-left:auto}
nav button{background:none;border:0;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{background:var(--ac);color:var(--ac-ink)}
.btn{background:var(--card2);border:1px solid var(--line);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#3a4552}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.btn.dng{color:var(--rd)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font:700 15px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.kpi .v{font:800 34px/1.1 'Barlow Condensed';letter-spacing:.02em;margin-top:2px}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .s{color:var(--mu);font-size:12px;margin-top:2px}
.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.two,.three{grid-template-columns:1fr}nav{margin-left:0;width:100%}nav button{flex:1;padding:8px 6px}}
.bar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select,.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:0;min-width:0}
.tools input:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.tools input[type=search]{flex:1;min-width:180px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font:700 12px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--mu);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:var(--card2)}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.t-Paid{color:var(--gn);border-color:#1f6b45;background:#0f2a1d}
.t-Partial{color:var(--am);border-color:#7a5712;background:#2b2108}
.t-Unpaid{color:var(--rd);border-color:#7a2a35;background:#2d1118}
.t-Inactive,.t-Upcoming{color:var(--mu);border-color:var(--line);background:var(--card2)}
.t-over{color:#fff;background:var(--rd);border-color:var(--rd)}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:10}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;padding:20px}
.modal.wide{max-width:760px}
.modal h2{font:800 24px 'Barlow Condensed';letter-spacing:.05em;margin-bottom:12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{color:var(--tx);text-transform:none;letter-spacing:0;font-size:14px;width:100%;color-scheme:dark}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:58px;text-align:center;border-radius:8px;padding:5px 0;font-size:11.5px;font-weight:600;border:1px solid}
.chip small{display:block;font-weight:500;opacity:.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ac-ink);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20}
.banner{background:#2b2108;border:1px solid #7a5712;color:var(--am);padding:9px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card2);border-radius:10px;padding:10px}
.stats b{display:block;font:800 22px 'Barlow Condensed'}
a{color:var(--bl)}
textarea.csv{width:100%;height:220px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px;font:12px monospace;color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">FIT<b>NOX</b><small>GYM MANAGER</small></div>
    <button class="btn sm" id="sync" data-act="settings" style="border-radius:20px">…</button>
    <nav id="nav">
      <button data-tab="dash" class="on">Dashboard</button>
      <button data-tab="members">Members</button>
      <button data-tab="payments">Payments</button>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const CUR=todayISO().slice(0,7);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const addM=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n-1;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const range=(a,b)=>{const r=[];for(let x=a;x<=b&&r.length<600;x=addM(x,1))r.push(x);return r};
const mLabel=ym=>MN[+ym.slice(5)-1]+" '"+ym.slice(2,4);
const dLabel=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return dd+' '+MN[+m-1]+' '+y};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const PLANS={Basic:800,Standard:1200,Premium:2000,Quarterly:3000,'Half-Yearly':5400,Annual:9600};
const METHODS=['Cash','UPI','Card','Bank transfer'];

/* ---------- state ---------- */
let members=[],payments=[],db=null,dlApi=null,loaded=false,calc={},byMember={};
const ui={tab:'dash',q:'',st:'all',plan:'all',pay:'all',sort:'name',pq:'',pm:'all',pmeth:'all',modal:null};

function recompute(){
  byMember={};calc={};
  for(const p of payments)(byMember[p.memberId]=byMember[p.memberId]||[]).push(p);
  for(const m of members){
    const start=(m.joinDate||todayISO()).slice(0,7),end=m.endMonth||CUR;
    const paidBy={};let total=0;
    for(const p of byMember[m.id]||[]){paidBy[p.forMonth]=(paidBy[p.forMonth]||0)+p.amount;total+=p.amount}
    let pending=0,unpaid=0,overdue=0;
    for(const mo of start<=end?range(start,end):[]){
      const due=Math.max(0,m.fee-(paidBy[mo]||0));
      if(due>0){pending+=due;unpaid++;if(mo<CUR)overdue++}
    }
    const paidNow=paidBy[CUR]||0;
    let status;
    if(m.status!=='active'&&(m.endMonth||'9')<CUR)status='Inactive';
    else if(start>CUR)status='Upcoming';
    else status=paidNow>=m.fee?'Paid':paidNow>0?'Partial':'Unpaid';
    const last=(byMember[m.id]||[]).reduce((a,p)=>p.date>a?p.date:a,'');
    calc[m.id]={start,paidBy,total,pending,unpaid,overdue,status,last};
  }
}

/* ---------- storage: local cache + Google Sheet sync ---------- */
const LS='fitnox_data_v1',LSQ='fitnox_queue_v1',LSC='fitnox_cfg_v1';
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let cfg=rd(LSC,{url:'',pass:''}),queue=rd(LSQ,[]),flushing=false,syncMsg='';
function persist(){try{localStorage.setItem(LS,JSON.stringify({members,payments}));localStorage.setItem(LSQ,JSON.stringify(queue))}catch(e){}}
function toast(t){const e=$('#toast');e.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML='',2400)}
function setSync(s,msg){
  const e=$('#sync');if(!e)return;
  const m={local:['#ffb020','Local only · tap to connect Google Sheet'],syncing:['#5ab0ff','Syncing…'],ok:['#3ddc84','Synced with Google Sheet'],fail:['#ff5468','Sync failed — '+(msg||'check connection')+' (tap to fix)']}[s];
  e.innerHTML='<span style="color:'+m[0]+'">●</span> '+esc(m[1])+(queue.length&&s!=='ok'?' · '+queue.length+' pending':'');
}
async function api(body){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pass:cfg.pass})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Server error');return j;
}
async function pull(){
  const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'action=all&pass='+encodeURIComponent(cfg.pass));
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Server error');return j;
}
async function flush(){
  if(!cfg.url||flushing)return;flushing=true;setSync('syncing');
  try{
    while(queue.length){await api(queue[0]);queue.shift();persist()}
    const j=await pull();members=j.members;payments=j.payments;persist();refresh();setSync('ok');
  }catch(e){setSync('fail',e.message)}
  flushing=false;
}
async function save(col,obj){
  const arr=col==='members'?members:payments,i=arr.findIndex(x=>x.id===obj.id);
  i>=0?arr[i]=obj:arr.push(obj);
  queue.push({action:'upsert',sheet:col==='members'?'Members':'Payments',row:obj});
  persist();refresh();flush();
}
async function remove(col,id){
  if(col==='members')members=members.filter(x=>x.id!==id);else payments=payments.filter(x=>x.id!==id);
  queue.push({action:'delete',sheet:col==='members'?'Members':'Payments',id});
  persist();refresh();flush();
}
function refresh(){recompute();renderMain();if(ui.modal&&ui.modal.type==='detail')renderModal()}
async function connect(){
  const url=$('#c_url').value.trim(),pass=$('#c_pass').value;
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){toast('Paste the Web app URL ending in /exec');return}
  const old=cfg;cfg={url,pass};
  try{
    const j=await pull();
    if(!j.members.length&&!j.payments.length&&(members.length||payments.length)){
      members.forEach(m=>queue.push({action:'upsert',sheet:'Members',row:m}));
      payments.forEach(p=>queue.push({action:'upsert',sheet:'Payments',row:p}));
      toast('Connected — uploading your existing data');
    }else{members=j.members;payments=j.payments;toast('Connected ✓')}
    localStorage.setItem(LSC,JSON.stringify(cfg));persist();closeModal();refresh();flush();
  }catch(e){cfg=old;toast('Could not connect: '+e.message)}
}
async function init(){
  const c=rd(LS,null);if(c){members=c.members||[];payments=c.payments||[]}
  loaded=true;render();
  if(cfg.url){setSync('syncing');flush();setInterval(()=>{if(!queue.length&&!document.hidden)flush()},60000);window.addEventListener('online',flush)}
  else setSync('local');
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  recompute();renderMain();
}
function renderMain(){
  const m=$('#main');
  if(!loaded&&!members.length){m.innerHTML='<div class="empty">Loading…</div>';return}
  if(ui.tab==='dash')m.innerHTML=dashHTML();
  else if(ui.tab==='members'){m.innerHTML=membersShell();renderMembersTable()}
  else{m.innerHTML=paymentsShell();renderPaymentsTable()}
}

/* ----- dashboard ----- */
function monthRev(ym){return payments.reduce((a,p)=>a+(p.date.slice(0,7)===ym?p.amount:0),0)}
function dashHTML(){
  if(!members.length)return `<div class="card empty"><div style="font:800 26px 'Barlow Condensed';color:var(--tx)">Welcome to FITNOX</div><p style="margin:8px 0 16px">No members yet. Add your first member, or load sample data to explore.</p><button class="btn pri" data-act="addMember">+ Add member</button> <button class="btn" data-act="demo">Load sample data</button></div>`;
  const act=members.filter(m=>m.status==='active');
  const expected=act.filter(m=>calc[m.id].start<=CUR).reduce((a,m)=>a+m.fee,0);
  const paidFor=act.reduce((a,m)=>a+Math.min(m.fee,calc[m.id].paidBy[CUR]||0),0);
  const rev=monthRev(CUR),prev=monthRev(addM(CUR,-1));
  const pending=members.reduce((a,m)=>a+calc[m.id].pending,0);
  const unpaidN=act.filter(m=>['Unpaid','Partial'].includes(calc[m.id].status)).length;
  const newN=members.filter(m=>calc[m.id].start===CUR).length;
  const ytd=payments.filter(p=>p.date.slice(0,4)===CUR.slice(0,4)).reduce((a,p)=>a+p.amount,0);
  const delta=prev?Math.round((rev-prev)/prev*100):null;
  const rate=expected?Math.round(paidFor/expected*100):0;
  const months=range(addM(CUR,-11),CUR),vals=months.map(monthRev),mx=Math.max(1,...vals);
  const W=640,H=190,bw=W/12;
  const bars=vals.map((v,i)=>{const h=Math.round(v/mx*(H-50));const x=i*bw+8,y=H-26-h,cur=i===11;
    return `<rect x="${x}" y="${y}" width="${bw-16}" height="${Math.max(h,2)}" rx="4" fill="${cur?'#c6ff3d':'#3a4552'}"/><text x="${x+(bw-16)/2}" y="${H-8}" text-anchor="middle" fill="#8f9aa6" font-size="11">${MN[+months[i].slice(5)-1]}</text>${v?`<text x="${x+(bw-16)/2}" y="${y-5}" text-anchor="middle" fill="${cur?'#c6ff3d':'#8f9aa6'}" font-size="10.5">${v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':v}</text>`:''}`}).join('');
  const defs=members.filter(m=>calc[m.id].pending>0).sort((a,b)=>calc[b.id].pending-calc[a.id].pending).slice(0,6);
  const recent=[...payments].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
  const planCnt={};act.forEach(m=>planCnt[m.plan]=(planCnt[m.plan]||0)+1);
  const planRev={};payments.filter(p=>p.date.slice(0,7)===CUR).forEach(p=>{const m=members.find(x=>x.id===p.memberId);const k=m?m.plan:'—';planRev[k]=(planRev[k]||0)+p.amount});
  const meth={};payments.filter(p=>p.date.slice(0,7)===CUR).forEach(p=>meth[p.method]=(meth[p.method]||0)+p.amount);
  const mTot=Object.values(meth).reduce((a,b)=>a+b,0)||1;
  const pc=Object.entries(planCnt).sort((a,b)=>b[1]-a[1]),pcMax=Math.max(1,...pc.map(x=>x[1]));
  return `
  <div class="tools"><button class="btn pri" data-act="addMember">+ Add member</button><button class="btn" data-act="addPay">+ Record payment</button></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Collected this month</div><div class="v" style="color:var(--ac)">${inr(rev)}</div><div class="s">${delta===null?'First month of data':(delta>=0?'▲ ':'▼ ')+Math.abs(delta)+'% vs last month ('+inr(prev)+')'}</div></div>
    <div class="card kpi"><div class="l">Due this month</div><div class="v">${inr(Math.max(0,expected-paidFor))}</div><div class="s">${rate}% of ${inr(expected)} collected</div><div class="bar" style="margin-top:8px"><i style="width:${rate}%"></i></div></div>
    <div class="card kpi"><div class="l">Total outstanding</div><div class="v" style="color:${pending?'var(--rd)':'var(--gn)'}">${inr(pending)}</div><div class="s">${unpaidN} member${unpaidN===1?'':'s'} unpaid / partial now</div></div>
    <div class="card kpi"><div class="l">Active members</div><div class="v">${act.length}</div><div class="s">${newN} joined this month · ${members.length-act.length} inactive</div></div>
    <div class="card kpi"><div class="l">Revenue ${CUR.slice(0,4)} (YTD)</div><div class="v">${inr(ytd)}</div><div class="s">Avg ${inr(act.length?expected/act.length:0)} / member / month</div></div>
  </div>
  <div class="grid two" style="margin-bottom:12px">
    <div class="card"><h3>Revenue — last 12 months</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly revenue bar chart">${bars}</svg></div>
    <div class="card"><h3>Top dues</h3>${defs.length?defs.map(m=>`<div class="row"><span><a href="#" data-act="detail" data-id="${m.id}" style="color:var(--tx);text-decoration:none;font-weight:600">${esc(m.name)}</a><br><span class="mu sm">${calc[m.id].unpaid} month${calc[m.id].unpaid>1?'s':''} unpaid</span></span><b style="color:var(--rd)">${inr(calc[m.id].pending)}</b></div>`).join(''):'<div class="empty">All clear — no dues 🎉</div>'}</div>
  </div>
  <div class="grid three">
    <div class="card"><h3>Recent payments</h3>${recent.map(p=>`<div class="row"><span>${esc(p.memberName)}<br><span class="mu sm">${dLabel(p.date)} · ${esc(p.method)}</span></span><b>${inr(p.amount)}</b></div>`).join('')||'<div class="empty">No payments yet</div>'}</div>
    <div class="card"><h3>Members by plan</h3>${pc.map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0 0 4px"><span>${esc(k)}</span><span class="mu">${v} · ${inr(planRev[k]||0)} this month</span></div><div class="bar"><i style="width:${v/pcMax*100}%"></i></div></div>`).join('')}</div>
    <div class="card"><h3>This month by method</h3>${Object.entries(meth).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0 0 4px"><span>${esc(k)}</span><span class="mu">${inr(v)} · ${Math.round(v/mTot*100)}%</span></div><div class="bar"><i style="width:${v/mTot*100}%;background:var(--or)"></i></div></div>`).join('')||'<div class="empty">No payments this month</div>'}</div>
  </div>
  <div class="tools" style="margin-top:14px"><button class="btn sm" data-act="expMembers">Export members CSV</button><button class="btn sm" data-act="expPay">Export payments CSV</button></div>`;
}

/* ----- members ----- */
function membersShell(){
  const plans=[...new Set(members.map(m=>m.plan))];
  return `<div class="tools">
    <input type="search" id="q" placeholder="Search name or phone…" value="${esc(ui.q)}">
    <select id="fst"><option value="all">All status</option><option value="active">Active</option><option value="paused">Paused</option><option value="cancelled">Cancelled</option></select>
    <select id="fplan"><option value="all">All plans</option>${plans.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
    <select id="fpay"><option value="all">Payment: any</option><option>Paid</option><option>Partial</option><option>Unpaid</option><option value="Overdue">Overdue (older months)</option></select>
    <select id="fsort"><option value="name">Sort: Name</option><option value="pending">Sort: Highest dues</option><option value="join">Sort: Newest joined</option><option value="fee">Sort: Fee</option><option value="last">Sort: Last paid</option></select>
    <button class="btn pri" data-act="addMember">+ Add member</button>
  </div><div class="tw" id="mt"></div>`;
}
function setSel(){[['fst','st'],['fplan','plan'],['fpay','pay'],['fsort','sort']].forEach(([id,k])=>{const e=$('#'+id);if(e)e.value=ui[k]})}
function renderMembersTable(){
  setSel();
  const q=ui.q.trim().toLowerCase();
  let l=members.filter(m=>(!q||m.name.toLowerCase().includes(q)||(m.contact||'').includes(q))&&(ui.st==='all'||m.status===ui.st)&&(ui.plan==='all'||m.plan===ui.plan)&&(ui.pay==='all'||(ui.pay==='Overdue'?calc[m.id].overdue>0:calc[m.id].status===ui.pay)));
  const s=ui.sort;
  l.sort((a,b)=>s==='pending'?calc[b.id].pending-calc[a.id].pending:s==='join'?b.joinDate.localeCompare(a.joinDate):s==='fee'?b.fee-a.fee:s==='last'?(calc[b.id].last||'').localeCompare(calc[a.id].last||''):a.name.localeCompare(b.name));
  $('#mt').innerHTML=l.length?`<table><thead><tr><th>Member</th><th>Contact</th><th>Plan</th><th class="r">Fee/mo</th><th>Joined</th><th>This month</th><th class="r">Dues</th><th class="r">Total paid</th><th></th></tr></thead><tbody>${l.map(m=>{const c=calc[m.id];return `<tr class="clk" data-act="detail" data-id="${m.id}"><td><b>${esc(m.name)}</b>${m.status!=='active'?` <span class="mu sm">(${m.status})</span>`:''}</td><td>${esc(m.contact)}</td><td>${esc(m.plan)}</td><td class="r">${inr(m.fee)}</td><td>${dLabel(m.joinDate)}</td><td><span class="tag t-${c.status}">${c.status}</span>${c.overdue?` <span class="tag t-over">${c.overdue} overdue</span>`:''}</td><td class="r" style="color:${c.pending?'var(--rd)':'var(--mu)'}"><b>${inr(c.pending)}</b></td><td class="r">${inr(c.total)}</td><td class="r"><button class="btn sm pri" data-act="addPay" data-id="${m.id}">Pay</button></td></tr>`}).join('')}</tbody></table><div class="mu sm" style="padding:10px 12px">${l.length} of ${members.length} members · dues shown: ${inr(l.reduce((a,m)=>a+calc[m.id].pending,0))}</div>`:`<div class="empty">${members.length?'No members match these filters.':'No members yet. Click “+ Add member”.'}</div>`;
}

/* ----- payments ----- */
function paymentsShell(){
  const mos=[...new Set(payments.map(p=>p.date.slice(0,7)))].sort().reverse();
  return `<div class="tools">
    <input type="search" id="pq" placeholder="Search member…" value="${esc(ui.pq)}">
    <select id="pm"><option value="all">All months</option>${mos.map(m=>`<option value="${m}">${mLabel(m)}</option>`).join('')}</select>
    <select id="pmeth"><option value="all">All methods</option>${METHODS.map(x=>`<option>${x}</option>`).join('')}</select>
    <button class="btn" data-act="expPay">Export CSV</button>
    <button class="btn pri" data-act="addPay">+ Record payment</button>
  </div><div class="tw" id="pt"></div>`;
}
function filteredPayments(){
  const q=ui.pq.trim().toLowerCase();
  return payments.filter(p=>(!q||p.memberName.toLowerCase().includes(q))&&(ui.pm==='all'||p.date.slice(0,7)===ui.pm)&&(ui.pmeth==='all'||p.method===ui.pmeth)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
function renderPaymentsTable(){
  [['pm','pm'],['pmeth','pmeth']].forEach(([id,k])=>{const e=$('#'+id);if(e)e.value=ui[k]});
  const l=filteredPayments();
  $('#pt').innerHTML=l.length?`<table><thead><tr><th>Date</th><th>Member</th><th>For month</th><th>Method</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead><tbody>${l.slice(0,500).map(p=>`<tr><td>${dLabel(p.date)}</td><td>${esc(p.memberName)}</td><td>${mLabel(p.forMonth)}</td><td>${esc(p.method)}</td><td class="mu">${esc(p.note||'')}</td><td class="r"><b>${inr(p.amount)}</b></td><td class="r"><button class="btn sm dng" data-act="delPay" data-id="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table><div class="mu sm" style="padding:10px 12px">${l.length} payments · total ${inr(l.reduce((a,p)=>a+p.amount,0))}</div>`:'<div class="empty">No payments found.</div>';
}

/* ---------- modals ---------- */
function openModal(type,id,extra){ui.modal={type,id,extra};renderModal()}
function closeModal(){ui.modal=null;$('#modal').innerHTML=''}
function renderModal(){
  const mo=ui.modal;if(!mo){$('#modal').innerHTML='';return}
  let h='';
  if(mo.type==='member')h=memberForm(members.find(m=>m.id===mo.id));
  else if(mo.type==='pay')h=payForm(mo.id);
  else if(mo.type==='detail')h=detailHTML(members.find(m=>m.id===mo.id));
  else if(mo.type==='confirm')h=`<div class="modal"><h2>${esc(mo.extra.title)}</h2><p class="mu">${esc(mo.extra.text)}</p><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn dng" data-act="doConfirm">Delete</button></div></div>`;
  else if(mo.type==='settings')h=`<div class="modal"><h2>Google Sheet sync</h2><p class="mu sm" style="margin-bottom:10px">Paste the Web app URL from your Apps Script deployment (see SETUP.md) and the passcode you set in Code.gs.</p><div class="f"><label class="full">Web app URL<input id="c_url" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label><label class="full">Passcode<input id="c_pass" type="password" value="${esc(cfg.pass)}"></label></div><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="connect">Connect</button></div></div>`;
  else if(mo.type==='csv')h=`<div class="modal wide"><h2>${esc(mo.extra.name)}</h2><p class="mu sm" style="margin-bottom:8px">Downloads aren't available here. Copy this and paste into Excel / Sheets (save as .csv).</p><textarea class="csv" id="csvbox" readonly>${esc(mo.extra.text)}</textarea><div class="acts"><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="copyCsv">Copy</button></div></div>`;
  if(!h){closeModal();return}
  $('#modal').innerHTML=`<div class="ov" data-act="ovclose">${h}</div>`;
}
function memberForm(m){
  const e=!!m;m=m||{name:'',contact:'',plan:'Standard',fee:PLANS.Standard,joinDate:todayISO(),status:'active',notes:''};
  return `<div class="modal"><h2>${e?'Edit member':'New member'}</h2><div class="f" id="mf" data-id="${e?m.id:''}">
    <label class="full">Full name<input id="f_name" value="${esc(m.name)}" autocomplete="off"></label>
    <label>Contact (phone)<input id="f_contact" inputmode="tel" value="${esc(m.contact)}"></label>
    <label>Join date<input id="f_join" type="date" value="${m.joinDate}"></label>
    <label>Plan<input id="f_plan" list="plans" value="${esc(m.plan)}"><datalist id="plans">${Object.keys(PLANS).map(p=>`<option>${p}</option>`).join('')}</datalist></label>
    <label>Monthly fee (₹)<input id="f_fee" type="number" min="0" value="${m.fee}"></label>
    <label>Status<select id="f_status">${['active','paused','cancelled'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="full">Notes<textarea id="f_notes" rows="2">${esc(m.notes||'')}</textarea></label>
  </div><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="saveMember">Save</button></div></div>`;
}
function payForm(mid){
  const opts=[...members].sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)}</option>`).join('');
  return `<div class="modal"><h2>Record payment</h2><div class="f">
    <label class="full">Member<select id="p_mem">${opts}</select></label>
    <label>For month<input id="p_mo" type="month" value="${CUR}"></label>
    <label>Months covered<input id="p_n" type="number" min="1" max="24" value="1"></label>
    <label>Total amount (₹)<input id="p_amt" type="number" min="1"></label>
    <label>Date paid<input id="p_date" type="date" value="${todayISO()}"></label>
    <label>Method<select id="p_meth">${METHODS.map(x=>`<option>${x}</option>`).join('')}</select></label>
    <label>Note<input id="p_note" placeholder="optional"></label>
  </div><p class="mu sm" id="p_hint" style="margin-top:8px"></p>
  <div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="savePay">Save payment</button></div></div>`;
}
function suggestAmt(){
  const m=members.find(x=>x.id===$('#p_mem')?.value);if(!m)return;
  const n=Math.max(1,+$('#p_n').value||1),mo=$('#p_mo').value||CUR;
  let sum=0;for(let i=0;i<n;i++)sum+=Math.max(0,m.fee-(calc[m.id].paidBy[addM(mo,i)]||0));
  $('#p_amt').value=sum||m.fee*n;
  $('#p_hint').textContent=sum?`Outstanding for ${mLabel(mo)}${n>1?' + '+(n-1)+' more':''}: ${inr(sum)} (fee ${inr(m.fee)}/mo)`:`Already fully paid — amount set to advance payment.`;
}
function detailHTML(m){
  if(!m)return'';const c=calc[m.id];
  const hist=[...(byMember[m.id]||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const chips=range(addM(CUR,-11),CUR).map(mo=>{
    if(mo<c.start||mo>(m.endMonth||CUR))return `<div class="chip t-Inactive">${MN[+mo.slice(5)-1]}<small>—</small></div>`;
    const p=c.paidBy[mo]||0,k=p>=m.fee?'Paid':p>0?'Partial':'Unpaid';
    return `<div class="chip t-${k}">${MN[+mo.slice(5)-1]} '${mo.slice(2,4)}<small>${k}</small></div>`});
  const ph=(m.contact||'').replace(/\D/g,''),wa=ph.length===10?'91'+ph:ph;
  const msg=encodeURIComponent(`Hi ${m.name}, this is a gentle reminder from FITNOX: your gym fee of ${inr(c.pending)} is pending. Please pay at your earliest. Thank you! 💪`);
  return `<div class="modal wide"><h2>${esc(m.name)} <span class="tag t-${c.status}" style="vertical-align:middle;font-size:12px">${c.status}</span></h2>
  <div class="mu">${esc(m.contact)} · ${esc(m.plan)} · ${inr(m.fee)}/mo · joined ${dLabel(m.joinDate)} · ${m.status}${m.notes?'<br>'+esc(m.notes):''}</div>
  <div class="stats"><div><span class="mu sm">Total paid</span><b>${inr(c.total)}</b></div><div><span class="mu sm">Outstanding</span><b style="color:${c.pending?'var(--rd)':'var(--gn)'}">${inr(c.pending)}</b></div><div><span class="mu sm">Last payment</span><b style="font-size:17px">${c.last?dLabel(c.last):'—'}</b></div></div>
  <h3 class="mu sm" style="text-transform:uppercase;letter-spacing:.1em;margin:4px 0 6px">Last 12 months</h3><div class="chips">${chips.join('')}</div>
  <h3 class="mu sm" style="text-transform:uppercase;letter-spacing:.1em;margin:16px 0 6px">Payment history (${hist.length})</h3>
  ${hist.length?`<div class="tw"><table style="min-width:480px"><tbody>${hist.map(p=>`<tr><td>${dLabel(p.date)}</td><td>${mLabel(p.forMonth)}</td><td>${esc(p.method)}</td><td class="mu">${esc(p.note||'')}</td><td class="r"><b>${inr(p.amount)}</b></td><td class="r"><button class="btn sm dng" data-act="delPay" data-id="${p.id}">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="mu">No payments recorded.</div>'}
  <div class="acts"><button class="btn dng" data-act="delMember" data-id="${m.id}">Delete member</button><span style="flex:1"></span>
  ${c.pending&&wa?`<a class="btn" href="https://wa.me/${wa}?text=${msg}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp reminder</a>`:''}
  <button class="btn" data-act="editMember" data-id="${m.id}">Edit</button><button class="btn pri" data-act="addPay" data-id="${m.id}">Record payment</button><button class="btn" data-act="close">Close</button></div></div>`;
}

/* ---------- actions ---------- */
async function saveMember(){
  const g=i=>$('#'+i).value.trim(),id=$('#mf').dataset.id;
  const name=g('f_name');if(!name){toast('Enter a name');return}
  const old=members.find(m=>m.id===id);
  const o={id:id||uid(),name,contact:g('f_contact'),plan:g('f_plan')||'Custom',fee:Math.max(0,+g('f_fee')||0),joinDate:g('f_join')||todayISO(),status:g('f_status'),notes:g('f_notes')};
  if(o.status!=='active')o.endMonth=(old&&old.status!=='active'&&old.endMonth)?old.endMonth:addM(CUR,-1);
  await save('members',o);closeModal();toast(id?'Member updated':'Member added');
}
async function savePay(){
  const m=members.find(x=>x.id===$('#p_mem').value);if(!m){toast('Pick a member');return}
  const total=+$('#p_amt').value,n=Math.max(1,Math.min(24,+$('#p_n').value||1)),mo=$('#p_mo').value;
  if(!(total>0)||!mo){toast('Enter amount and month');return}
  const each=Math.round(total/n*100)/100,date=$('#p_date').value||todayISO();
  for(let i=0;i<n;i++)await save('payments',{id:uid(),memberId:m.id,memberName:m.name,amount:i===n-1?Math.round((total-each*(n-1))*100)/100:each,date,forMonth:addM(mo,i),method:$('#p_meth').value,note:$('#p_note').value.trim()});
  closeModal();toast('Payment recorded: '+inr(total));
}
function ask(title,text,fn){ui.modal={type:'confirm',extra:{title,text,fn}};renderModal()}
function csvOf(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function exportCSV(name,text){
  try{const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  catch(e){openModal('csv',null,{name,text})}
}
async function demo(){
  const names=['Rohan Naik','Priya Desai','Amit Kamat','Sneha Gaonkar','Vikram Shetty','Neha Prabhu','Rahul Fernandes','Anjali Borkar','Karan Volvoikar','Mitali Parab','Sagar Dessai','Pooja Redkar','Nikhil Sawant','Divya Kerkar'];
  const plans=['Basic','Standard','Premium','Standard','Basic','Premium','Standard','Quarterly','Basic','Standard','Premium','Basic','Standard','Premium'];
  toast('Loading sample data…');
  for(let i=0;i<names.length;i++){
    const plan=plans[i],fee=PLANS[plan],back=[6,5,5,4,4,3,3,6,2,2,1,1,0,0][i],start=addM(CUR,-back);
    const m={id:uid(),name:names[i],contact:'98'+String(10000000+Math.floor(Math.random()*89999999)),plan,fee,joinDate:start+'-'+String(1+Math.floor(Math.random()*20)).padStart(2,'0'),status:'active',notes:''};
    await save('members',m);
    for(const mo of range(start,CUR)){
      if(mo===CUR&&Math.random()<.45)continue;
      if(mo<CUR&&Math.random()<.12)continue;
      await save('payments',{id:uid(),memberId:m.id,memberName:m.name,amount:fee,date:mo+'-'+String(2+Math.floor(Math.random()*Math.min(24,mo===CUR?+todayISO().slice(8)-1||1:25))).padStart(2,'0'),forMonth:mo,method:METHODS[Math.floor(Math.random()*3)],note:''});
    }
  }
  toast('Sample data loaded');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const nb=e.target.closest('#nav button');
  if(nb){ui.tab=nb.dataset.tab;render();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if(act==='ovclose'){if(e.target===t)closeModal();return}
  if(t.tagName==='A'&&act==='detail')e.preventDefault();
  if(t.tagName==='TR'&&e.target.closest('button'))return;
  e.stopPropagation&&0;
  switch(act){
    case'addMember':openModal('member');break;
    case'editMember':openModal('member',id);break;
    case'addPay':openModal('pay',id);setTimeout(suggestAmt,0);break;
    case'detail':openModal('detail',id);break;
    case'close':closeModal();break;
    case'saveMember':saveMember();break;
    case'savePay':savePay();break;
    case'delMember':{const m=members.find(x=>x.id===id);ask('Delete '+m.name+'?','This removes the member and all their payment history. This cannot be undone.',async()=>{for(const p of byMember[id]||[])await remove('payments',p.id);await remove('members',id);toast('Member deleted')});break}
    case'delPay':{const p=payments.find(x=>x.id===id);const back=ui.modal&&ui.modal.type==='detail'?ui.modal:null;ask('Delete payment?',inr(p.amount)+' for '+p.memberName+' ('+mLabel(p.forMonth)+').',async()=>{await remove('payments',id);toast('Payment deleted');if(back){ui.modal=back;renderModal()}});break}
    case'doConfirm':{const fn=ui.modal.extra.fn;closeModal();await fn();break}
    case'settings':openModal('settings');break;
    case'connect':connect();break;
    case'demo':demo();break;
    case'expMembers':exportCSV('fitnox-members.csv',csvOf([['Name','Contact','Plan','Monthly fee','Joined','Status','This month','Outstanding','Total paid','Last payment'],...members.map(m=>{const c=calc[m.id];return[m.name,m.contact,m.plan,m.fee,m.joinDate,m.status,c.status,c.pending,c.total,c.last]})]));break;
    case'expPay':exportCSV('fitnox-payments.csv',csvOf([['Date','Member','For month','Method','Amount','Note'],...filteredPayments().map(p=>[p.date,p.memberName,p.forMonth,p.method,p.amount,p.note||''])]));break;
    case'copyCsv':{const b=$('#csvbox');b.select();try{await navigator.clipboard.writeText(b.value);toast('Copied')}catch(x){document.execCommand&&document.execCommand('copy');toast('Copied')}break}
  }
});
document.addEventListener('input',e=>{
  const i=e.target.id;
  if(i==='q'){ui.q=e.target.value;renderMembersTable()}
  else if(i==='pq'){ui.pq=e.target.value;renderPaymentsTable()}
  else if(i==='p_n'||i==='p_mo')suggestAmt();
});
document.addEventListener('change',e=>{
  const i=e.target.id,v=e.target.value;
  const map={fst:'st',fplan:'plan',fpay:'pay',fsort:'sort',pm:'pm',pmeth:'pmeth'};
  if(map[i]){ui[map[i]]=v;i[0]==='f'?renderMembersTable():renderPaymentsTable()}
  else if(i==='p_mem')suggestAmt();
  else if(i==='f_plan'&&PLANS[v])$('#f_fee').value=PLANS[v];
});
init();
</script>
</body>
</html>
